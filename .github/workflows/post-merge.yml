name: post-merge

# After a promotion PR merges (auto-merge fires once the prod gate passed), record the merge
# commit on the CAB item. The item stays in ReadyForDeploy: that state means "cleared and on
# main"; moving it to Closed is for whoever confirms the rollout.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  record-merge:
    if: ${{ github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'promote/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Write merge commit to the CAB item
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG_URL: ${{ vars.ADO_ORG_URL }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          e = os.environ
          ids = sorted({int(x) for x in re.findall(r"AB#(\d+)", e["PR_BODY"] or "")})
          if len(ids) != 1 or not e.get("ADO_PAT") or not e.get("ADO_ORG_URL"):
              print("no single CAB reference or ADO not configured; nothing to record", ids); raise SystemExit(0)
          ops = [{"op": "add", "path": "/fields/System.History",
                  "value": f"Merged to main as <a href=\"{e['REPO_URL']}/commit/{e['MERGE_SHA']}\">{e['MERGE_SHA'][:12]}</a> ({e['PR_URL']}). Cleared for deploy."}]
          req = urllib.request.Request(f"{e['ADO_ORG_URL']}/_apis/wit/workitems/{ids[0]}?api-version=7.1", data=json.dumps(ops).encode(), method="PATCH",
                headers={"Content-Type": "application/json-patch+json", "Authorization": "Basic " + base64.b64encode((":" + e['ADO_PAT']).encode()).decode()})
          with urllib.request.urlopen(req) as r:
              print("CAB", ids[0], "state", json.load(r)["fields"]["System.State"], "merge", e["MERGE_SHA"][:12])
          PY
