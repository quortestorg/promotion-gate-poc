name: post-merge

# After a promotion or rollback PR merges (auto-merge fires once the prod gate passed):
#   promote/<tag>  -> close the CAB item, record the merge commit in Merge SHA (used by a later
#                     rollback) and in the history.
#   rollback/<tag> -> close the Rollback item with the merge commit, and close the original CAB
#                     (which was in RollbackRequired) noting the rollback.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  record-merge:
    if: ${{ github.event.pull_request.merged && (startsWith(github.event.pull_request.head.ref, 'promote/') || startsWith(github.event.pull_request.head.ref, 'rollback/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Close the work item(s) with the merge commit
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG_URL: ${{ vars.ADO_ORG_URL }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          e = os.environ
          if not e.get("ADO_PAT") or not e.get("ADO_ORG_URL"):
              print("ADO not configured; nothing to record"); raise SystemExit(0)
          auth = "Basic " + base64.b64encode((":" + e['ADO_PAT']).encode()).decode()
          def patch(wid, ops):
              req = urllib.request.Request(f"{e['ADO_ORG_URL']}/_apis/wit/workitems/{wid}?api-version=7.1", data=json.dumps(ops).encode(), method="PATCH",
                    headers={"Content-Type": "application/json-patch+json", "Authorization": auth})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)["fields"]["System.State"]
          link = f"<a href=\"{e['REPO_URL']}/commit/{e['MERGE_SHA']}\">{e['MERGE_SHA'][:12]}</a>"
          ids = sorted({int(x) for x in re.findall(r"AB#(\d+)", e["PR_BODY"] or "")})
          if len(ids) != 1:
              print("expected exactly one AB# reference in the PR body, found", ids); raise SystemExit(0)
          item = ids[0]
          if e["HEAD_REF"].startswith("promote/"):
              print("CAB", item, "->", patch(item, [
                  {"op": "add", "path": "/fields/System.State", "value": "Closed"},
                  {"op": "add", "path": "/fields/Custom.MergeSHA", "value": e["MERGE_SHA"]},
                  {"op": "add", "path": "/fields/System.History", "value": f"Merged to main as {link} ({e['PR_URL']}). Closed by post-merge."}]))
          else:
              m = re.search(r"Rolls back CAB \| (\d+)", e["PR_BODY"] or "")
              print("Rollback", item, "->", patch(item, [
                  {"op": "add", "path": "/fields/System.State", "value": "Closed"},
                  {"op": "add", "path": "/fields/Custom.MergeSHA", "value": e["MERGE_SHA"]},
                  {"op": "add", "path": "/fields/System.History", "value": f"Rollback merged to main as {link} ({e['PR_URL']}). Closed by post-merge."}]))
              if m:
                  cab = int(m.group(1))
                  print("CAB", cab, "->", patch(cab, [
                      {"op": "add", "path": "/fields/System.State", "value": "Closed"},
                      {"op": "add", "path": "/fields/System.History", "value": f"Rolled back by Rollback AB#{item}, merged as {link}. Closed by post-merge."}]))
          PY
