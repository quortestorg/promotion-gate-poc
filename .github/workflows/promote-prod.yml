name: promote-prod

# Gate C proof of concept, step 1 of 2.
#
# Manually started. Renders the prod overlay with the requested release tag, opens a pull
# request that carries the rendered manifest (the artifact the CAB reviews), creates the CAB
# work item in Azure DevOps with links back to the PR and to the commits included, and then
# starts prod-gate.yml on the PR branch. Nothing here is gated and nothing is deployed.
#
# The gate itself lives in prod-gate.yml: its job targets the `prod` environment, whose
# protection rules (required reviewers + the cab-checker custom rule) hold it until the CAB
# is approved.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag being promoted to prod (for example v1.4.0)
        required: true
        type: string
      source_compare_url:
        description: Optional compare link for the source change (for example an image tag range in the app repo)
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  render-and-open-pr:
    # Only from main. workflow_dispatch already requires write access on the repo.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_url: ${{ steps.pr.outputs.url }}
      head_sha: ${{ steps.push.outputs.head_sha }}
      cab_id: ${{ steps.cab.outputs.id }}
    steps:
      # Token for pushing the branch, opening the PR and dispatching the gate. The built-in token
      # cannot open PRs here (org policy) and PRs it opens never trigger other workflows, so the
      # job mints a token from the same GitHub App that implements the gate (APP_ID variable and
      # APP_PRIVATE_KEY secret), falling back to a PAT secret, then to the built-in token.
      - name: Mint GitHub App token
        id: app
        if: ${{ vars.APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.PROMOTION_TOKEN || github.token }}

      - name: Validate tag
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] || { echo "::error::release_tag must be SemVer like v1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::tag $TAG already promoted"; exit 1; fi

      - name: Install tools
        run: |
          pip install --quiet pyyaml
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Record previous tag and set the new one
        id: prev
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          FILE=environments/prod/kustomization.yaml
          PREV=$(grep -oP 'release-tag:\s*\K\S+' "$FILE")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          sed -i -E "s#(release-tag:\s*)\S+#\1${TAG}#" "$FILE"
          grep -n 'release-tag' "$FILE"

      - name: Render prod and diff against main
        id: render
        run: |
          git show origin/main:rendered/prod.yaml > /tmp/prod-before.yaml 2>/dev/null || : > /tmp/prod-before.yaml
          bash tools/ci/render-prod.sh
          set +e
          diff -u /tmp/prod-before.yaml rendered/prod.yaml > /tmp/prod.diff
          set -e
          ADDED=$(grep -c '^+[^+]' /tmp/prod.diff || true); REMOVED=$(grep -c '^-[^-]' /tmp/prod.diff || true)
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"; echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
          head -c 60000 /tmp/prod.diff > /tmp/prod.diff.pr

      - name: Upload full diff artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-diff-${{ inputs.release_tag }}
          path: |
            /tmp/prod.diff
            rendered/prod.yaml

      - name: Push promotion branch
        id: push
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          BRANCH="promote/${TAG}"
          git config user.name "promotion-bot"
          git config user.email "promotion-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add environments/prod/kustomization.yaml rendered/prod.yaml
          git commit -m "promote(prod): ${TAG}" -m "Rendered manifest regenerated by tools/ci/render-prod.sh"
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.PROMOTION_TOKEN || github.token }}
          TAG: ${{ inputs.release_tag }}
          PREV: ${{ steps.prev.outputs.prev }}
          SRC: ${{ inputs.source_compare_url }}
          BRANCH: ${{ steps.push.outputs.branch }}
          HEAD: ${{ steps.push.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          {
            echo "## Promotion to prod: ${TAG}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Previous prod tag | \`${PREV}\` |"
            echo "| New prod tag | \`${TAG}\` |"
            echo "| Commits included (this repo) | ${REPO_URL}/compare/${PREV}...${HEAD} |"
            [ -n "$SRC" ] && echo "| Source change | ${SRC} |"
            echo "| Rendered head | \`${HEAD}\` |"
            echo "| Full diff artifact | ${RUN_URL} (artifact \`rendered-diff-${TAG}\`) |"
            echo
            echo "### Rendered manifest diff (\`rendered/prod.yaml\`, +${{ steps.render.outputs.added }} / -${{ steps.render.outputs.removed }})"
            echo
            echo '```diff'
            cat /tmp/prod.diff.pr
            echo '```'
            echo
            echo "_CAB link is added by the workflow after the work item is created._"
          } > /tmp/pr-body.md
          URL=$(gh pr create --base main --head "$BRANCH" --title "promote(prod): ${TAG}" --body-file /tmp/pr-body.md --label promotion 2>/dev/null \
             || gh pr create --base main --head "$BRANCH" --title "promote(prod): ${TAG}" --body-file /tmp/pr-body.md)
          NUM=${URL##*/}
          echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Create CAB work item in Azure DevOps
        id: cab
        if: ${{ vars.ADO_ORG_URL != '' }}
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG_URL: ${{ vars.ADO_ORG_URL }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT }}
          ADO_AREA_PATH: ${{ vars.ADO_AREA_PATH }}
          ADO_WORK_ITEM_TYPE: ${{ vars.ADO_WORK_ITEM_TYPE || 'User Story' }}
          TAG: ${{ inputs.release_tag }}
          PREV: ${{ steps.prev.outputs.prev }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD: ${{ steps.push.outputs.head_sha }}
          SRC: ${{ inputs.source_compare_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$ADO_PAT" ] || { echo "::error::ADO_PAT secret is not set"; exit 1; }
          export REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.parse
          e = os.environ
          manifest_url = f"{e['REPO_URL']}/blob/{e['HEAD']}/rendered/prod.yaml"
          desc = f"""<p><b>Change:</b> promote release <b>{e['TAG']}</b> to prod (previous {e['PREV']}).</p>
          <p><b>Rendered manifest PR:</b> <a href="{e['PR_URL']}">{e['PR_URL']}</a></p>
          <p><b>Resulting manifest at the reviewed commit:</b> <a href="{manifest_url}">rendered/prod.yaml @ {e['HEAD'][:12]}</a></p>
          <p><b>Commits included:</b> <a href="{e['REPO_URL']}/compare/{e['PREV']}...{e['HEAD']}">{e['PREV']}...{e['HEAD'][:12]}</a></p>
          {'<p><b>Source change:</b> <a href="'+e['SRC']+'">'+e['SRC']+'</a></p>' if e.get('SRC') else ''}
          <p><b>Pipeline run:</b> <a href="{e['RUN_URL']}">{e['RUN_URL']}</a></p>
          <p><b>How to approve:</b> review the PR, then set <b>Owner Approver</b> (CAB owners group) or <b>Security Approver</b> (CAB Security group) to yourself. The gate releases when both are set and the PR head still equals <b>PR Head SHA</b>; the item then moves to ReadyForDeploy.</p>"""
          patch = [
            {"op":"add","path":"/fields/System.Title","value":f"CAB: promote {e['TAG']} to prod"},
            {"op":"add","path":"/fields/System.Description","value":desc},
            {"op":"add","path":"/fields/System.Tags","value":"PromotionPoC"},
            {"op":"add","path":"/fields/Custom.PRHeadSHA","value":e['HEAD']},
            {"op":"add","path":"/fields/Custom.PRUrl","value":e['PR_URL']},
            {"op":"add","path":"/fields/Custom.ReleaseTag","value":e['TAG']},
            {"op":"add","path":"/fields/Custom.AKSmanifest","value":manifest_url},
            {"op":"add","path":"/relations/-","value":{"rel":"Hyperlink","url":e['PR_URL'],"attributes":{"comment":"Rendered manifest PR"}}},
          ]
          if e.get("ADO_AREA_PATH"):
            patch.append({"op":"add","path":"/fields/System.AreaPath","value":e["ADO_AREA_PATH"]})
          url = f"{e['ADO_ORG_URL'].rstrip('/')}/{urllib.parse.quote(e['ADO_PROJECT'])}/_apis/wit/workitems/${urllib.parse.quote(e['ADO_WORK_ITEM_TYPE'])}?api-version=7.1"
          req = urllib.request.Request(url, data=json.dumps(patch).encode(), method="POST", headers={
            "Content-Type":"application/json-patch+json",
            "Authorization":"Basic "+base64.b64encode((":"+e['ADO_PAT']).encode()).decode()})
          with urllib.request.urlopen(req) as r:
            wi = json.load(r)
          print("created", wi["id"], wi["_links"]["html"]["href"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write(f"id={wi['id']}\nurl={wi['_links']['html']['href']}\n")
          PY
          echo "REPO_URL=$REPO_URL" >/dev/null

      - name: Link CAB on the PR
        if: ${{ steps.cab.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.PROMOTION_TOKEN || github.token }}
          NUM: ${{ steps.pr.outputs.number }}
          CAB_ID: ${{ steps.cab.outputs.id }}
          CAB_URL: ${{ steps.cab.outputs.url }}
        run: |
          gh pr view "$NUM" --json body -q .body > /tmp/body.md
          python3 - <<'PY'
          import os
          p = "/tmp/body.md"; s = open(p, encoding="utf-8").read()
          marker = "_CAB link is added by the workflow after the work item is created._"
          link = f"**CAB:** AB#{os.environ['CAB_ID']} {os.environ['CAB_URL']}"
          s = s.replace(marker, link) if marker in s else s + "\n\n" + link + "\n"
          open(p, "w", encoding="utf-8").write(s)
          PY
          gh pr edit "$NUM" --body-file /tmp/body.md

      - name: Start the prod gate on the PR branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.PROMOTION_TOKEN || github.token }}
        run: |
          gh workflow run prod-gate.yml --ref "${{ steps.push.outputs.branch }}" \
            -f pr_number="${{ steps.pr.outputs.number }}" \
            -f cab_id="${{ steps.cab.outputs.id }}" \
            -f cab_url="${{ steps.cab.outputs.url }}" \
            -f release_tag="${{ inputs.release_tag }}"
          sleep 10
          GATE_URL=$(gh run list --workflow prod-gate.yml --branch "${{ steps.push.outputs.branch }}" --limit 1 --json url -q '.[0].url')
          echo "PR:   ${{ steps.pr.outputs.url }}"
          echo "CAB:  ${{ steps.cab.outputs.url }}"
          echo "Gate: ${GATE_URL}"
          {
            echo "## Promotion ${{ inputs.release_tag }} staged"
            echo
            echo "| | |"; echo "|---|---|"
            echo "| Rendered manifest PR | ${{ steps.pr.outputs.url }} |"
            echo "| CAB work item | AB#${{ steps.cab.outputs.id }} ${{ steps.cab.outputs.url }} |"
            echo "| Prod gate run (approve here) | ${GATE_URL} |"
            echo
            echo "Next: approvers set Owner Approver and Security Approver on the CAB item; a required reviewer approves the prod deployment on the gate run."
          } >> "$GITHUB_STEP_SUMMARY"
