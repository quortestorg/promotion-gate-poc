apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
labels:
  - includeSelectors: false
    pairs:
      environment: prod
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: web-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: warn

# Promotion marker. promote-prod.yml rewrites this value with the release tag being promoted,
# so every rendered prod object carries the tag the CAB approved.
commonAnnotations:
  poc.example.com/release-tag: v1.3.0
